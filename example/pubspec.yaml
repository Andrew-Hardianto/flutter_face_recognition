name: flutter_face_recognition_example
description: "Demonstrates how to use the flutter_face_recognition plugin for enrollment, liveness anti-spoofing, and cosine similarity verification."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_face_recognition:
    path: ../
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

